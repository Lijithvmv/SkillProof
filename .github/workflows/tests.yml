name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (real defects only; rules in pyproject.toml)
        run: python -m pip install "ruff==0.8.4" && python -m ruff check src tests
      - name: Test
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -t skillproof:ci .
      - name: Image starts and answers its health check
        run: |
          mkdir -p ci-config && printf '[server]\nhost = "0.0.0.0"\nport = 8045\n[storage]\ndata_dir = "/data"\n' > ci-config/skillproof.toml
          docker run -d --name sp -p 8045:8045 -v "$PWD/ci-config:/config:ro" skillproof:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8045/health/ready && exit 0; sleep 2; done
          docker logs sp; exit 1
