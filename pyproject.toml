[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillproof"
version = "1.7.0"
description = "Evidence-backed structural and intelligence analysis for agent skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "PyYAML>=6,<7", "python-multipart>=0.0.9", "PyJWT[crypto]>=2.10,<3"]

[project.scripts]
skillproof = "skillproof.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
openai = ["openai>=1.68,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

