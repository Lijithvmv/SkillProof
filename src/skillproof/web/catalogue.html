<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillProof Catalogue</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #dde1e6;
  --accent: #2456c7; --accent-ink: #ffffff;
  --block: #b42318; --block-bg: #fde8e6; --ask: #8a5a00; --ask-bg: #fdf1d8; --note: #3d5a80; --note-bg: #e6eef8;
  --ok: #1e7a46; --ok-bg: #e2f4ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151a; --panel: #1a1e25; --ink: #e7eaee; --muted: #9aa3ae; --line: #2c323b;
    --accent: #6d95f0; --accent-ink: #0d1117;
    --block: #ff8a80; --block-bg: #3a1c1a; --ask: #f2c46b; --ask-bg: #33290f; --note: #9cbcec; --note-bg: #1c2840;
    --ok: #7fd3a1; --ok-bg: #15301f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; }
header .who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); }
input, select, button, textarea { font: inherit; color: inherit; }
input[type=text], input[type=password], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.danger { background: var(--block); color: #fff; }
button:disabled { opacity: .45; cursor: not-allowed; }
main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; padding: 16px; max-width: 1280px; margin: 0 auto; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
h2 { font-size: 15px; margin: 0 0 10px; }
h3 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.skill { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
.skill strong { display: block; overflow-wrap: anywhere; }
.ver { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 6px; margin: 2px -6px; border-radius: 4px; cursor: pointer; }
.ver:hover, .ver.sel { background: var(--bg); }
.ver code { font-size: 12px; color: var(--muted); }
.badge { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-block { color: var(--block); background: var(--block-bg); }
.b-ask { color: var(--ask); background: var(--ask-bg); }
.b-note, .b-none { color: var(--note); background: var(--note-bg); }
.b-active, .b-pass, .b-approved { color: var(--ok); background: var(--ok-bg); }
.b-state { color: var(--muted); background: var(--bg); border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td code { overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.msg { padding: 8px 10px; border-radius: 6px; margin: 8px 0; overflow-wrap: anywhere; }
.msg.err { background: var(--block-bg); color: var(--block); }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.ack { border: 1px solid var(--block); background: var(--block-bg); border-radius: 6px; padding: 10px; margin: 10px 0; }
.ack label { display: flex; gap: 8px; align-items: flex-start; }
.scroll { overflow-x: auto; }
ol.events { padding-left: 18px; margin: 0; }
ol.events li { margin: 2px 0; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>SkillProof Catalogue</h1>
  <div class="who" id="who"></div>
</header>
<main>
  <section class="panel">
    <h2>Add a version</h2>
    <form id="upload">
      <input type="file" id="zip" accept=".zip" required>
      <h3>Run evidence (optional)</h3>
      <div class="row">
        <label>Lift (pp) <input type="text" id="lift" size="5" inputmode="decimal"></label>
        <label>Paired runs <input type="text" id="runs" size="4" inputmode="numeric"></label>
        <label>Models <input type="text" id="models" size="3" inputmode="numeric"></label>
        <label>Cost overhead % <input type="text" id="cost" size="5" inputmode="decimal"></label>
      </div>
      <p class="row"><button type="submit">Upload and compare</button></p>
    </form>
    <div id="uploadMsg"></div>
    <h2 style="margin-top:18px">Skills <span class="muted" id="count"></span></h2>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="filter" placeholder="Search skills" aria-label="Search skills" style="flex:1;min-width:120px">
      <select id="level" aria-label="Filter by level">
        <option value="">All levels</option><option value="block">Block</option><option value="ask">Ask or worse</option><option value="waiting">Waiting for a decision</option>
      </select>
    </div>
    <div id="skills"><div class="empty">Loading…</div></div>
    <h2 style="margin-top:18px">Fleet <span class="muted" id="fleetCount"></span></h2>
    <div id="fleet"><div class="empty">No machine has reported yet. Run <code>skillproof fleet-report --server …</code> on each machine.</div></div>
  </section>
  <section class="panel" id="detail"><div class="empty">Pick a version to see what it adds and to approve or promote it.</div></section>
</main>
<script>
"use strict";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const state = { selected: null, dev: true, auth: { mode: "local" } };
// The access token lives in memory only: never in localStorage, gone when the tab closes.
let accessToken = null;
const once = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
               take(k) { let v = null; try { v = sessionStorage.getItem(k); sessionStorage.removeItem(k); } catch (e) {} return v; } };

function b64url(bytes) { return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function randomText(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }
function redirectUri() { return location.origin + location.pathname; }

async function startSignIn() {
  // Authorization code flow with PKCE (public client): only the code verifier's hash leaves the browser.
  const verifier = randomText(48), stateValue = randomText(24), nonce = randomText(24);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  once.set("sp-pkce", JSON.stringify({ verifier, state: stateValue }));
  const a = state.auth;
  const url = new URL(a.authorization_endpoint);
  Object.entries({ response_type: "code", client_id: a.client_id, redirect_uri: redirectUri(), scope: a.scope,
    state: stateValue, nonce, code_challenge: challenge, code_challenge_method: "S256" }).forEach(([k, v]) => url.searchParams.set(k, v));
  if (a.audience) url.searchParams.set("audience", a.audience);
  location.assign(url.toString());
}

async function finishSignIn() {
  const params = new URLSearchParams(location.search);
  if (!params.has("code") && !params.has("error")) return;
  history.replaceState(null, "", redirectUri());  // the code never stays in the address bar or history
  const saved = JSON.parse(once.take("sp-pkce") || "null");
  if (params.has("error")) throw new Error("Sign-in failed: " + (params.get("error_description") || params.get("error")));
  if (!saved || saved.state !== params.get("state")) throw new Error("Sign-in failed: the response does not match the request.");
  const body = new URLSearchParams({ grant_type: "authorization_code", code: params.get("code"), redirect_uri: redirectUri(),
    client_id: state.auth.client_id, code_verifier: saved.verifier });
  const response = await fetch(state.auth.token_endpoint, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
  const tokens = await response.json().catch(() => ({}));
  if (!response.ok || !tokens.access_token) throw new Error("Sign-in failed: " + (tokens.error_description || tokens.error || response.statusText));
  accessToken = tokens.access_token;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function badge(text, kind) { return `<span class="badge b-${esc(kind || text)}">${esc(text)}</span>`; }
function short(id) { return esc(String(id || "").slice(0, 8)); }

function headers(extra) {
  const h = Object.assign({}, extra || {});
  if (accessToken) h["Authorization"] = "Bearer " + accessToken;
  else if (state.auth.mode === "local") { h["X-SkillProof-Dev-User"] = store.get("sp-user") || "local-dev"; h["X-SkillProof-Dev-Role"] = store.get("sp-role") || "tenant_admin"; }
  return h;
}
async function api(path, options) {
  options = options || {};
  const response = await fetch(path, Object.assign({}, options, { headers: headers(options.headers) }));
  let body = null;
  try { body = await response.json(); } catch (e) {}
  if (!response.ok) throw new Error((body && (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail))) || response.statusText);
  return body;
}

async function renderWho() {
  const who = document.getElementById("who");
  if (state.auth.mode === "oidc" && !accessToken) {
    state.dev = false;
    who.innerHTML = state.auth.sign_in
      ? `<span>Not signed in</span><button id="signin">Sign in</button>`
      : `<span class="msg err">Sign-in is not configured on this server (set SKILLPROOF_OIDC_CLIENT_ID).</span><button class="secondary" id="tok">Use a token</button>`;
    if (state.auth.sign_in) document.getElementById("signin").onclick = () => startSignIn().catch(e => { who.innerHTML = `<span class="msg err">${esc(e.message)}</span>`; });
    else document.getElementById("tok").onclick = () => { const t = prompt("Bearer access token"); if (t) { accessToken = t.trim(); refresh(); } };
    return false;
  }
  let me = null;
  try { me = await api("/api/v1/whoami"); } catch (e) { who.innerHTML = `<span class="msg err">${esc(e.message)}</span>`; }
  const roles = ["tenant_admin", "evaluator", "approver", "viewer", "reporter"];
  const dev = !me || me.dev_identity;
  state.dev = dev;
  who.innerHTML = dev
    ? `<span>Local development identity</span>
       <input type="text" id="user" size="10" value="${esc(store.get("sp-user") || "local-dev")}" aria-label="User">
       <select id="role" aria-label="Role">${roles.map(r => `<option ${r === (store.get("sp-role") || "tenant_admin") ? "selected" : ""}>${r}</option>`).join("")}</select>
       <button class="secondary" id="switch">Switch</button>
       <button class="secondary" id="tok">Use a token</button>`
    : `<span>${esc(me.user_id)} · ${esc(me.role)} · tenant ${esc(me.tenant_id)}</span><button class="secondary" id="signout">Sign out</button>`;
  if (dev) {
    document.getElementById("switch").onclick = () => { store.set("sp-user", document.getElementById("user").value.trim() || "local-dev"); store.set("sp-role", document.getElementById("role").value); refresh(); };
    document.getElementById("tok").onclick = () => { const t = prompt("Bearer access token (kept in memory only)"); if (t) { accessToken = t.trim(); refresh(); } };
  } else {
    document.getElementById("signout").onclick = () => {
      accessToken = null;
      if (state.auth.end_session_endpoint) { const u = new URL(state.auth.end_session_endpoint); u.searchParams.set("post_logout_redirect_uri", redirectUri()); u.searchParams.set("client_id", state.auth.client_id || ""); location.assign(u.toString()); }
      else refresh();
    };
  }
  return !!me;
}

async function renderSkills() {
  const box = document.getElementById("skills");
  try {
    const data = await api("/api/v1/registry/catalogue");
    if (!data.skills.length) { box.innerHTML = `<div class="empty">No skills yet. Upload a skill ZIP or run skillproof catalogue-import.</div>`; return; }
    const query = document.getElementById("filter").value.trim().toLowerCase();
    const level = document.getElementById("level").value;
    const rank = { block: 3, ask: 2, note: 1, none: 0 };
    const shown = data.skills.filter(skill => {
      if (query && !skill.skill_name.toLowerCase().includes(query)) return false;
      const all = (skill.active ? [skill.active] : []).concat(skill.waiting);
      if (level === "block") return all.some(v => v.capability_decision === "block");
      if (level === "ask") return all.some(v => (rank[v.capability_decision] || 0) >= 2);
      if (level === "waiting") return skill.waiting.length > 0;
      return true;
    });
    document.getElementById("count").textContent = shown.length === data.skills.length ? `(${data.skills.length})` : `(${shown.length} of ${data.skills.length})`;
    if (!shown.length) { box.innerHTML = `<div class="empty">No skill matches.</div>`; return; }
    box.innerHTML = shown.map(skill => {
      const rows = [];
      if (skill.active) rows.push(verRow(skill.active, "active"));
      skill.waiting.forEach(v => rows.push(verRow(v, v.state)));
      return `<div class="skill"><strong>${esc(skill.skill_name)}</strong>
        <span class="muted">${skill.versions} version${skill.versions === 1 ? "" : "s"}${skill.active ? "" : " · nothing active"}</span>${rows.join("")}</div>`;
    }).join("");
    box.querySelectorAll(".ver").forEach(el => el.onclick = () => select(el.dataset.id));
  } catch (e) { box.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}
function verRow(v, label) {
  const level = v.capability_decision;
  return `<div class="ver ${state.selected === v.version_id ? "sel" : ""}" data-id="${esc(v.version_id)}" role="button" tabindex="0">
    <span><code>${short(v.version_id)}</code> ${badge(label.replace("_", " "), label === "active" ? "active" : "state")}</span>
    ${level ? badge(level === "none" ? "nothing new" : level, level) : ""}</div>`;
}

async function select(id) {
  state.selected = id;
  document.querySelectorAll(".ver").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  const box = document.getElementById("detail");
  box.innerHTML = `<div class="empty">Loading…</div>`;
  if (window.matchMedia("(max-width: 820px)").matches) box.scrollIntoView({ block: "start" });
  try {
    const [v, approvals] = await Promise.all([api(`/api/v1/registry/versions/${encodeURIComponent(id)}`),
      api(`/api/v1/registry/versions/${encodeURIComponent(id)}/approval-requests`).catch(() => ({ requests: [] }))]);
    box.innerHTML = detailHtml(v, approvals.requests);
    wireDetail(v, approvals.requests);
    renderRuns(v);
    renderJobs(v);
  } catch (e) { box.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}

function detailHtml(v, requests) {
  const change = v.capability_change;
  const against = change ? { nothing_active: "nothing active yet, so every capability counts as added",
    active_version: `the active version ${short(change.against_version_id)}`,
    active_version_without_manifest: "an active version that has no capability manifest",
    previous_version_not_approved: `the previous version ${short(change.against_version_id)} (nothing approved yet)`,
    full_review_not_human_written: `nothing: no person attests writing this update of ${short(change.against_version_id)}, so it is reviewed as a new skill` +
      (change.update_over_previous ? ` (the update itself: ${change.update_over_previous.decision}, ${change.update_over_previous.items.length} item(s))` : "")
  }[change.against] : "";
  const author = v.provenance ? `${esc(v.provenance.author_kind)}${v.provenance.agent ? " (" + esc(v.provenance.agent) + ")" : ""}` +
    `${v.provenance.on_behalf_of ? " for " + esc(v.provenance.on_behalf_of) : ""}` : "not recorded";
  const items = change ? change.items : [];
  const markable = v.state === "pending_review" || v.state === "not_eligible";
  const gates = (v.assurance && v.assurance.gates) || [];
  const s = v.summary || {};
  const latest = requests[0];
  return `
  <h2>${esc(v.skill_name)} <code class="muted">${short(v.version_id)}</code> ${badge(v.state.replace("_", " "), v.state === "active" ? "active" : "state")}</h2>
  <div class="muted">Package ${esc(String(v.package_fingerprint).slice(0, 16))}… · registered by ${esc(v.registered_by)} · ${esc(v.created_at)}</div>
  <div id="actionMsg"></div>
  <h3>What this version adds</h3>
  <p class="muted">Written by: ${author}.</p>
  ${change ? `<p class="muted">Compared with ${esc(against)}. ${esc(change.meaning)}</p>
    ${items.length ? `<div class="scroll"><table><thead><tr><th>Level</th><th>Capability</th><th>Why</th><th>Where</th>${markable ? "<th></th>" : ""}</tr></thead><tbody>
      ${items.map((i, n) => `<tr><td>${badge(i.level)}</td><td>${esc(i.category.replace(/_/g, " "))}<br><code>${esc(i.value)}</code>${i.widened ? `<br><span class="muted">reach ${esc(i.widened.before)} → ${esc(i.widened.after)}</span>` : ""}${i.confidence ? `<br><span class="muted" title="Share of flags of this kind that reviewers found real (public labels plus this tenant's decisions)">${esc(i.confidence.block)}: real in ${Number(i.confidence.real)} of ${Number(i.confidence.seen)}</span>` : ""}</td>
        <td>${i.reasons.map(esc).join("<br>")}</td><td>${i.locations.map(l => `<code>${esc(l)}</code>`).join("<br>")}</td>${markable ? `<td><button class="secondary mark" data-n="${n}" title="Mark as not a real capability (reviewers only)">Not real</button></td>` : ""}</tr>`).join("")}
      </tbody></table></div>${change.items_total > items.length ? `<p class="muted">Showing ${items.length} of ${change.items_total}.</p>` : ""}`
      : `<p>${badge("nothing new", "none")} No capability this version has is missing from what it is compared with.</p>`}
    ${(change.groups || []).map(g => `<p>${badge(g.kind === "offensive" ? "attack toolkit" : "audit library", "ask")} ${esc(g.meaning)}</p>`).join("")}
    ${(change.dismissed || []).length ? `<p class="muted">Marked not real by a reviewer (not counted): ${change.dismissed.map(d => `${esc(d.category.replace(/_/g, " "))} <code>${esc(d.value)}</code> by ${esc(d.marked_by)}: ${esc(d.reason)}`).join("; ")}</p>` : ""}
    ${Object.keys(change.removed || {}).length ? `<p class="muted">Removed: ${Object.entries(change.removed).map(([c, vals]) => esc(c.replace(/_/g, " ")) + " " + vals.map(x => `<code>${esc(x)}</code>`).join(", ")).join("; ")}</p>` : ""}`
    : `<p class="muted">This version was registered without a capability manifest.</p>`}
  <h3>Assurance · ${esc(s.assurance_decision || "")}</h3>
  ${(() => { const ev = (v.assurance && v.assurance.evidence) || { source: "none" };
    if (ev.source === "measured") return `<p>${badge("measured", "pass")} Behavioural evidence from experiment${ev.experiment_ids.length === 1 ? "" : "s"} ${ev.experiment_ids.map(id => `<code>${short(id)}</code>`).join(", ")} on ${ev.models.length ? ev.models.map(esc).join(", ") : "no measured model"}${(ev.lift_withheld_by_calibration || []).length ? `; lift withheld by grader calibration in ${ev.lift_withheld_by_calibration.length}` : ""}.</p>`;
    if (ev.source === "declared_by_uploader") return `<p>${badge("declared", "ask")} Behavioural numbers were typed by the uploader, not measured.</p>`;
    return `<p class="muted">No behavioural evidence: cite recorded experiments when uploading.</p>`; })()}
  <div id="runEvidence"></div>
  <div id="jobs"></div>
  <div class="scroll"><table><tbody>${gates.map(g => `<tr><td>${badge(g.status.replace(/_/g, " "), g.status === "pass" ? "pass" : (g.status === "blocked" || g.status === "fail") ? "block" : "ask")}</td><td>${esc(g.message)}</td></tr>`).join("")}</tbody></table></div>
  <h3>Approval</h3>
  ${latest ? `<p>Request <code>${short(latest.request_id)}</code> ${badge(latest.state.replace(/_/g, " "), latest.state === "approved" ? "approved" : "state")} · submitted by ${esc(latest.submitter_id)}</p>` : `<p class="muted">No approval request yet.</p>`}
  <div class="row" id="actions"></div>
  <h3>Audit trail</h3>
  <ol class="events">${(v.events || []).map(e => `<li><span class="muted">${esc(e.occurred_at)}</span> · ${esc(e.actor_id)} · <strong>${esc(e.action)}</strong> ${e.detail ? `<code>${esc(e.detail)}</code>` : ""}</li>`).join("")}</ol>`;
}

async function renderJobs(v) {
  // Run-evidence jobs: the server builds tests from the skill's own rules and runs them on its local model.
  const box = document.getElementById("jobs");
  if (!box) return;
  try {
    const { jobs } = await api(`/api/v1/registry/versions/${encodeURIComponent(v.version_id)}/jobs`);
    box.innerHTML = jobs.map(j => {
      const r = j.result || {};
      const pct = x => x === null || x === undefined ? "–" : `${Math.round(x * 100)}%`;
      const detail = j.state === "failed" ? `<code>${esc((j.error || "").split("\n")[0])}</code>`
        : j.state !== "done" ? `<span class="muted">${j.state === "running" ? "running on the server's local model" : "waiting for the worker"}</span>`
        : r.outcome === "no_tests" ? esc(r.message)
        : `${r.tests} tests from the skill's own rules on ${esc(r.model)}: followed ${pct(r.adherence_rate)} with the skill, ${pct(r.baseline_rate)} without${(r.broken_claims || []).length ? `; broken: ${r.broken_claims.map(esc).join(", ")}` : ""}. Assurance: ${esc(String(r.assurance || ""))}.`;
      return `<p>${badge("evidence job " + j.state, j.state === "done" ? "pass" : j.state === "failed" ? "block" : "ask")} ${detail}</p>`;
    }).join("");
    if (jobs.some(j => j.state === "queued" || j.state === "running")) setTimeout(() => {
      if (document.getElementById("jobs")) renderJobs(v);
    }, 15000);
  } catch (e) { box.innerHTML = ""; }
}

async function renderRuns(v) {
  // Does the skill do what it says? Adherence per claim from the runs this version's assurance cites.
  const ev = (v.assurance && v.assurance.evidence) || {};
  const box = document.getElementById("runEvidence");
  if (!box || ev.source !== "measured") return;
  try {
    const data = await api(`/api/v1/evaluations/experiments?skill_name=${encodeURIComponent(v.skill_name)}`);
    const cited = data.experiments.filter(e => (ev.experiment_ids || []).includes(e.experiment_id));
    box.innerHTML = cited.map(e => {
      const a = e.adherence, p = e.paired_by_task || {};
      const pct = x => x === null || x === undefined ? "–" : `${Math.round(x * 100)}%`;
      const head = `<p>Run <code>${short(e.experiment_id)}</code> on ${e.models.map(esc).join(", ")}: lift ${e.lift_pp === null ? "withheld" : `${Number(e.lift_pp).toFixed(1)} points`} (${esc(String(e.interpretation || "").replace(/_/g, " "))}${p.tasks ? `, ${p.tasks_improved} of ${p.tasks} tasks better, p = ${p.sign_flip_p_value}` : ""}).</p>`;
      if (!a) return head + `<p class="muted">This run has no claim checks, so adherence was not measured.</p>`;
      return head + `<p>Followed the skill's own claims: <strong>${pct(a.adherence_rate)}</strong> with the skill, ${pct(a.baseline_rate)} without it.${a.broken_with_skill.length ? ` ${badge(a.broken_with_skill.length + " broken", "block")}` : ""}</p>
        <div class="scroll"><table><thead><tr><th>Claim</th><th>With skill</th><th>Without</th></tr></thead><tbody>
        ${a.per_claim.map(c => `<tr><td><code>${esc(c.claim)}</code> ${esc(c.text || "")}</td><td>${c.with_skill !== null && c.with_skill < 0.5 ? badge(pct(c.with_skill), "block") : pct(c.with_skill)}</td><td>${pct(c.without_skill)}</td></tr>`).join("")}
        </tbody></table></div>`;
    }).join("") || `<p class="muted">The cited runs are not readable in this tenant's history.</p>`;
  } catch (e) { box.innerHTML = `<p class="muted">Runs not shown: ${esc(e.message)}</p>`; }
}

function wireDetail(v, requests) {
  const actions = document.getElementById("actions");
  const latest = requests[0];
  const change = v.capability_change;
  const msg = (text, ok) => { document.getElementById("actionMsg").innerHTML = `<div class="msg ${ok ? "ok" : "err"}">${esc(text)}</div>`; };
  const run = async (fn, okText) => { try { await fn(); await renderSkills(); await select(v.version_id); msg(okText, true); } catch (e) { msg(e.message, false); } };
  const buttons = [];
  document.querySelectorAll("button.mark").forEach(b => { b.onclick = () => {
    const item = change.items[Number(b.dataset.n)];
    const reason = window.prompt(`Why is "${item.value}" (${item.category.replace(/_/g, " ")}) not a real capability?`);
    if (!reason || !reason.trim()) return;
    run(() => api(`/api/v1/registry/versions/${encodeURIComponent(v.version_id)}/false-alarms`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category: item.category, value: item.value, reason: reason.trim() }) }), "Marked as not real; it will not be raised again for the same files.");
  }; });
  if (v.state === "pending_review" && (!latest || latest.state !== "pending_review" && latest.state !== "approved")) buttons.push(["Request approval", "", () =>
    run(() => api(`/api/v1/registry/versions/${encodeURIComponent(v.version_id)}/approval-requests`, { method: "POST" }), "Sent for approval.")]);
  if (latest && latest.state === "pending_review") {
    const decide = action => run(() => api(`/api/v1/approvals/${encodeURIComponent(latest.request_id)}/decision`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, comment: document.getElementById("comment").value }) }), "Decision recorded.");
    actions.insertAdjacentHTML("beforeend", `<input type="text" id="comment" placeholder="Comment (optional)" size="28">`);
    buttons.push(["Approve", "", () => decide("approve")], ["Request changes", "secondary", () => decide("request_changes")], ["Reject", "danger", () => decide("reject")]);
  }
  if (v.state === "pending_review" && latest && latest.state === "approved") {
    const blocking = change && change.decision === "block";
    if (blocking) actions.insertAdjacentHTML("beforebegin", `<div class="ack"><label><input type="checkbox" id="ack">
      <span>I have read the ${change.counts.block} block-level line${change.counts.block === 1 ? "" : "s"} above and accept change <code>${esc(change.change_hash.slice(0, 12))}</code>.</span></label></div>`);
    buttons.push(["Promote to active", "", () => run(() => api(`/api/v1/registry/versions/${encodeURIComponent(v.version_id)}/promote`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ approval_request_id: latest.request_id, capability_ack: blocking && document.getElementById("ack").checked ? change.change_hash : null }) }), "Promoted.")]);
  }
  if (v.state === "pending_review" || v.state === "not_eligible") buttons.push(["Run evidence", "secondary", () =>
    run(() => api(`/api/v1/registry/versions/${encodeURIComponent(v.version_id)}/evaluate`, { method: "POST" }),
      "Evidence job queued: the server builds tests from this skill's rules and runs them on its local model.")]);
  if (v.state === "active") buttons.push(["Roll back to previous approved", "danger", () => {
    const reason = window.prompt("Why roll back? The previous approved version becomes active and this one is retired.");
    if (!reason || !reason.trim()) return;
    run(() => api(`/api/v1/registry/skills/${encodeURIComponent(v.skill_name)}/rollback`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason: reason.trim() }) }), "Rolled back.");
  }]);
  buttons.forEach(([label, cls, fn]) => { const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; actions.appendChild(b); });
  if (!buttons.length) actions.innerHTML = `<span class="muted">${v.state === "not_eligible" ? "Not eligible: fix the failing assurance gates and upload a new version." : "No action available."}</span>`;
}

document.getElementById("upload").onsubmit = async event => {
  event.preventDefault();
  const out = document.getElementById("uploadMsg");
  const file = document.getElementById("zip").files[0];
  if (!file) return;
  const evidence = {};
  [["lift", "behavioral_lift_pp", parseFloat], ["runs", "paired_runs", v => parseInt(v, 10)], ["models", "measured_models", v => parseInt(v, 10)], ["cost", "cost_overhead_percent", parseFloat]]
    .forEach(([id, key, parse]) => { const raw = document.getElementById(id).value.trim(); if (raw) evidence[key] = parse(raw); });
  const form = new FormData();
  form.append("file", file);
  if (Object.keys(evidence).length) form.append("evidence_json", JSON.stringify(evidence));
  out.innerHTML = `<div class="muted">Analysing…</div>`;
  try {
    const result = await api("/api/v1/registry/versions", { method: "POST", body: form });
    out.innerHTML = `<div class="msg ok">Registered ${esc(result.version.skill_name)} ${short(result.version.version_id)}.</div>`;
    await renderSkills();
    select(result.version.version_id);
  } catch (e) { out.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
};

document.getElementById("filter").oninput = () => renderSkills();
document.getElementById("level").onchange = () => renderSkills();

async function refresh() {
  const ready = await renderWho();
  if (ready === false) { document.getElementById("skills").innerHTML = `<div class="empty">Sign in to see the catalogue.</div>`; return; }
  await renderSkills(); if (state.selected) select(state.selected);
  renderFleet();
}

async function renderFleet() {
  // Which machines run skills the catalogue did not approve (from skillproof fleet-report on each machine).
  try {
    const { hosts } = await api("/api/v1/fleet");
    document.getElementById("fleetCount").textContent = hosts.length ? `(${hosts.length} machine${hosts.length === 1 ? "" : "s"})` : "";
    if (!hosts.length) return;
    document.getElementById("fleet").innerHTML = hosts.map(h => `<div class="skill">
      <strong>${esc(h.host)}</strong> <span class="muted">${esc(h.reported_at)}</span><br>
      ${badge(h.counts.approved + " approved", "pass")} ${h.counts.running_unapproved ? badge(h.counts.running_unapproved + " running unapproved", "block") : ""} ${h.counts.never_approved ? badge(h.counts.never_approved + " never approved", "ask") : ""}
      ${h.running_unapproved.map(s => `<div class="muted">${esc(s.skill_name)}: installed <code>${esc(s.installed_fingerprint.slice(0, 12))}</code> is not the approved version${s.adds_over_approved ? ` (adds ${esc(s.adds_over_approved.decision)})` : ""}</div>`).join("")}
    </div>`).join("");
  } catch (e) { /* fleet reporting not enabled or not visible to this role */ }
}
(async () => {
  try { state.auth = await (await fetch("/api/v1/auth/config")).json(); } catch (e) { state.auth = { mode: "local" }; }
  try { await finishSignIn(); } catch (e) { document.getElementById("who").innerHTML = `<span class="msg err">${esc(e.message)}</span>`; }
  refresh();
})();
try { localStorage.removeItem("sp-token"); } catch (e) {}  // a token stored by an earlier version of this page
</script>
